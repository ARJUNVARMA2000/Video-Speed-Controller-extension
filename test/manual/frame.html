<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video frame fixture</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #05060a; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; }

<body>
  <video id="frame-video" src="sample.webm" muted loop playsinline controls></video>
</body>
