<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Speed Controller manual test</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 900px; margin: 0 auto; padding: 32px; background: #10121a; color: #f8fafc; }
    h1 { margin-bottom: 8px; }
    p { color: #aeb7c8; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    button { padding: 9px 14px; border: 0; border-radius: 7px; background: #e94560; color: white; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #ffb4c0; outline-offset: 2px; }
    .media-grid { display: grid; gap: 24px; }
    .media-card { padding: 16px; border: 1px solid #30364a; border-radius: 12px; background: #181b27; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #05060a; border-radius: 8px; }
    code { color: #ff9aac; }
    #status { min-height: 24px; color: #7ee787; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Video Speed Controller test lab</h1>
  <p>This page generates its video locally, so the smoke test never depends on a third-party media host.</p>

  <div class="actions">
    <button id="toggle-play">Play / pause</button>
    <button id="add-video">Add dynamic video</button>
    <button id="remove-video">Remove dynamic video</button>
    <button id="check">Check controllers</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>

  <main class="media-grid" id="media-grid">
    <section class="media-card">
      <h2>Initial HTML5 video</h2>
      <video id="primary-video" src="sample.webm" controls muted loop playsinline></video>
      <p>Expected: one overlay, working presets, keyboard shortcuts, screenshot, filters, and A–B loop.</p>
    </section>
  </main>

  <script>
    const primary = document.getElementById('primary-video');

    document.getElementById('toggle-play').addEventListener('click', () => {
      if (primary.paused) primary.play();
      else primary.pause();
    });

    document.getElementById('add-video').addEventListener('click', () => {
      if (document.getElementById('dynamic-video')) return;
      const card = document.createElement('section');
      card.className = 'media-card';
      card.id = 'dynamic-card';
      card.innerHTML = '<h2>Dynamic video</h2><video id="dynamic-video" src="sample.webm" controls muted loop playsinline></video><p>Expected: the overlay appears without reloading the page.</p>';
      document.getElementById('media-grid').append(card);
      card.querySelector('video').play().catch(() => {});
    });

    document.getElementById('remove-video').addEventListener('click', () => {
      document.getElementById('dynamic-card')?.remove();
    });

    document.getElementById('check').addEventListener('click', () => {
      const videos = document.querySelectorAll('video').length;
      const controllers = document.querySelectorAll('.vsc-controller').length;
      document.getElementById('status').textContent = `${controllers} controller(s) for ${videos} video(s) — ${controllers === videos ? 'pass' : 'check extension access or reload'}`;
    });
  </script>
</body>
</html>
